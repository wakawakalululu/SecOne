name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已有 tag（如 v1.0.0-rc1），仅在手动触发时使用"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest nuitka ordered-set zstandard
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests -q
      - name: Build standalone (Nuitka)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/build_exe.ps1 -SkipTests
      - name: Pack portable ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist/packages | Out-Null
          Compress-Archive -Path dist/SecOne -DestinationPath "dist/packages/SecOne-$tag-portable-win64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: portable-win64
          path: dist/packages/*.zip
          if-no-files-found: error
          retention-days: 7

  build-unix:
    name: build (${{ matrix.sys }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sys: linux
            arch: x86_64
          - os: macos-latest
            sys: macos
            arch: arm64
          - os: macos-13
            sys: macos
            arch: x86_64
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller
      - name: Run tests
        run: python -m pytest tests -q
      - name: Build portable (PyInstaller)
        run: bash packaging/build_unix.sh --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.sys }}-${{ matrix.arch }}
          path: dist/packages/*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  release:
    name: attach release assets
    needs: [build-windows, build-unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/packages
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist/packages
          sha256sum ./*.zip ./*.tar.gz | tee SHA256SUMS.txt
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          PRERELEASE=""
          case "$TAG" in
            *rc*|*RC*|*alpha*|*beta*) PRERELEASE="--prerelease" ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/packages/* --repo "$GITHUB_REPOSITORY" --clobber
            if [ -n "$PRERELEASE" ]; then
              gh release edit "$TAG" $PRERELEASE --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$TAG" dist/packages/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "SecOne $TAG" \
              --generate-notes $PRERELEASE
          fi
