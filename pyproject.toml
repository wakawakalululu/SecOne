[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secone"
version = "1.0.0rc1"
description = "SecOne - local-first AI security analysis workstation powered by XuanmuSec"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "SecOne Contributors" }]
dependencies = [
    "PySide6>=6.7,<6.10",
    "PyYAML>=6.0",
    "pypdf>=4.2",
    "Pillow>=10.3",
    "py7zr>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
secone = "secone.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
